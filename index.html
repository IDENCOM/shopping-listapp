<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>쇼핑 리스트</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 16px;
  }
  .app {
    width: 100%;
    max-width: 480px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
    overflow: hidden;
  }
  header {
    padding: 24px;
    background: #fafafa;
    border-bottom: 1px solid #eee;
  }
  h1 {
    font-size: 22px;
    color: #333;
    margin-bottom: 4px;
  }
  .summary {
    font-size: 13px;
    color: #888;
  }
  .input-row {
    display: flex;
    gap: 8px;
    padding: 16px 24px;
    border-bottom: 1px solid #eee;
  }
  #itemInput {
    flex: 1;
    padding: 12px 14px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
    transition: border 0.15s;
  }
  #itemInput:focus { border-color: #667eea; }
  #addBtn {
    padding: 0 18px;
    background: #667eea;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  #addBtn:hover { background: #5568d3; }
  ul {
    list-style: none;
    max-height: 50vh;
    overflow-y: auto;
  }
  .empty {
    padding: 40px 24px;
    text-align: center;
    color: #aaa;
    font-size: 14px;
  }
  li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 24px;
    border-bottom: 1px solid #f3f3f3;
    transition: background 0.1s;
  }
  li:hover { background: #fafafa; }
  li input[type="checkbox"] {
    width: 20px;
    height: 20px;
    cursor: pointer;
    accent-color: #667eea;
  }
  li .text {
    flex: 1;
    font-size: 15px;
    color: #333;
    word-break: break-word;
  }
  li.done .text {
    text-decoration: line-through;
    color: #aaa;
  }
  .delete-btn {
    background: transparent;
    border: none;
    color: #d33;
    font-size: 18px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 4px;
    opacity: 0.5;
    transition: opacity 0.15s, background 0.15s;
  }
  li:hover .delete-btn { opacity: 1; }
  .delete-btn:hover { background: #fee; }
  footer {
    padding: 12px 24px;
    background: #fafafa;
    border-top: 1px solid #eee;
    display: flex;
    justify-content: flex-end;
  }
  #clearBtn {
    background: transparent;
    border: none;
    color: #888;
    font-size: 13px;
    cursor: pointer;
    padding: 6px 10px;
    border-radius: 4px;
  }
  #clearBtn:hover { color: #d33; background: #fff; }
  #clearBtn:disabled { opacity: 0.3; cursor: not-allowed; }
</style>
</head>
<body>
  <div class="app">
    <header>
      <h1>🛒 쇼핑 리스트</h1>
      <div class="summary" id="summary">아이템 0개</div>
    </header>
    <div class="input-row">
      <input id="itemInput" type="text" placeholder="추가할 아이템 입력 후 Enter" maxlength="100" />
      <button id="addBtn">추가</button>
    </div>
    <ul id="list"></ul>
    <footer>
      <button id="clearBtn">완료 항목 비우기</button>
    </footer>
  </div>

<script>
  const STORAGE_KEY = "shopping-list-v1";
  const listEl = document.getElementById("list");
  const inputEl = document.getElementById("itemInput");
  const addBtn = document.getElementById("addBtn");
  const clearBtn = document.getElementById("clearBtn");
  const summaryEl = document.getElementById("summary");

  let items = load();

  function load() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch {
      return [];
    }
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  }

  function render() {
    listEl.innerHTML = "";
    if (items.length === 0) {
      const empty = document.createElement("li");
      empty.className = "empty";
      empty.textContent = "아직 아이템이 없어요. 위에서 추가해 보세요.";
      listEl.appendChild(empty);
    } else {
      for (const item of items) {
        const li = document.createElement("li");
        if (item.done) li.classList.add("done");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = item.done;
        checkbox.addEventListener("change", () => toggle(item.id));

        const text = document.createElement("span");
        text.className = "text";
        text.textContent = item.text;

        const del = document.createElement("button");
        del.className = "delete-btn";
        del.textContent = "✕";
        del.title = "삭제";
        del.addEventListener("click", () => remove(item.id));

        li.append(checkbox, text, del);
        listEl.appendChild(li);
      }
    }

    const remaining = items.filter(i => !i.done).length;
    const doneCount = items.length - remaining;
    summaryEl.textContent = `남은 항목 ${remaining}개 · 완료 ${doneCount}개`;
    clearBtn.disabled = doneCount === 0;
  }

  function add() {
    const text = inputEl.value.trim();
    if (!text) return;
    items.push({ id: Date.now() + Math.random(), text, done: false });
    inputEl.value = "";
    save();
    render();
    inputEl.focus();
  }

  function toggle(id) {
    const item = items.find(i => i.id === id);
    if (item) item.done = !item.done;
    save();
    render();
  }

  function remove(id) {
    items = items.filter(i => i.id !== id);
    save();
    render();
  }

  function clearDone() {
    items = items.filter(i => !i.done);
    save();
    render();
  }

  addBtn.addEventListener("click", add);
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") add();
  });
  clearBtn.addEventListener("click", clearDone);

  render();
  inputEl.focus();
</script>
</body>
</html>
